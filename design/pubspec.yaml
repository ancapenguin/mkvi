name: mkvi_design
description: >-
  Design token source of truth for the mkvi desktop app. tokens.json is the
  file; lib/generated/tokens.g.dart is its compiled form, generated by
  tool/generate_tokens.dart and gated by test/contrast_test.dart. The app takes
  this package as a path dependency, so the tokens are reachable from
  production code without a second copy.
#
# The GENERATOR and the GATE stay Flutter-free on purpose: `dart test` validates
# the token contract with no Flutter toolchain, which is why this package has no
# `flutter` dependency. lib/generated/tokens.g.dart does import
# package:flutter/material.dart, because a ThemeExtension cannot exist without
# it, so that ONE file is analyzable only from a consumer that has Flutter
# (the app). The gate never compiles it: test/contrast_test.dart checks it as
# BYTES, which is the stronger check anyway - the file is never executed here.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.6.0

dev_dependencies:
  test: ^1.25.0
