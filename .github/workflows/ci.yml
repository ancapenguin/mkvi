# MKVI — sürekli entegrasyon
#
# Bu kapı `.\tool.ps1 gate`'in CI karşılığıdır. İkisi aynı adımları koşar;
# biri yeni bir adım ekliyorsa diğeri de eklenmelidir, yoksa "yeşil" iki farklı
# şeyi kastedecek.
#
# 2026-09-26'da 0.1.x Tauri hattı emekliye ayrıldı: kök `npm test` (vitest),
# `tsc --noEmit` ve `cargo test --locked src-tauri` kaldırıldı çünkü artık
# ölü kodu doğruluyorlardı. Bunun yerine `mkvi_bridge` testleri geldi — onlar
# daha önce HİÇBİR YERDE koşmuyordu.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surum:
    name: Sürüm tutarlılığı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sürümün dört kaynağı aynı sayıyı göstermeli: VERSION, app/pubspec.yaml,
      # crates/mkvi_core, crates/mkvi_bridge. 2026-09-26'da ölçüldü: VERSION 0.2.0
      # iken beş kaynak 0.1.4'te kalmıştı ve yayın hattı yanlış sürüm basıyordu.
      - name: Sürüm kaynaklarını karşılaştır
        shell: pwsh
        run: ./tool.ps1 version

  rust:
    name: Rust çekirdek + Dart köprüsü
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # mkvi_core'in `rusqlite`'i bundled SQLite derler, yani C derleyicisi ister.
      # Ubuntu 22.04'te ayrıca Tauri'nin sistem bağımlılıkları da gerekli değil
      # artık (0.1.x emekliye ayrıldı) ama WebRTC/medya bağımlılıkları kaldı.
      - name: Sistem bağımlılıkları (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      # --- Gate · Rust çekirdek ---
      # Ed25519 kimlik, keyring/DPAPI, XChaCha20-Poly1305'li SQLite, dosya
      # yazma ve imza doğrulama. UI çerçevesi bilmez; `frontendDist` okumaz.
      - name: "cargo test (mkvi_core)"
        working-directory: crates/mkvi_core
        run: cargo test --locked

      # --- Gate · Dart köprüsü ---
      # 2026-09-26'ya kadar 15 testi ne tool.ps1 ne bu dosya koşuyordu.
      - name: "cargo test (mkvi_bridge)"
        working-directory: crates/mkvi_bridge
        run: cargo test

  design:
    name: Tasarım kontrastı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1

      # `design/` bilinçli olarak Flutter'sız saf Dart paketidir: kontrast kapısı
      # 816 ölçülmüş oranı Flutter araç zincirine ihtiyaç duymadan koşar.
      - run: dart pub get
        working-directory: design

      # `analysis_options.yaml` yalnız ÜRETİLEN dosyayı dışlar (o dosya
      # `flutter/material` import eder ve saf Dart altında derlenemez). Üretici
      # ve kontrast testi analiz kapsamındadır.
      - name: dart analyze
        working-directory: design
        run: dart analyze

      - name: dart test (kontrast)
        working-directory: design
        run: dart test

  flutter:
    name: Flutter uygulaması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kanal kasıtlı olarak sabitlenir. Sürümü kilitlemek, kapının "şu anda
      # bende geçiyor, sizde kırılır" hatasını üretir.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bağımlılıkları kur (app)
        working-directory: app
        run: flutter pub get

      - name: flutter analyze
        working-directory: app
        run: flutter analyze --no-pub

      # `flutter test` bu aşamada yalnız Dart tarafını koşar (birim + widget
      # testleri). Eklenti kodu derlenmez; Android SDK/NDK gerekmez.
      - name: flutter test
        working-directory: app
        run: flutter test

  worker:
    name: Sinyalleşme Worker'ı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      # Worker içerik taşımaz: `isSignalPayload` anahtar bazında beyaz liste
      # kullanır. Anahtarı daraltmak, hâlâ gönderen istemcileri `close(1008)`
      # ile düşürür — kırıcıdır.
      - name: Bağımlılıkları kur
        working-directory: cloudflare
        run: npm ci

      - name: vitest
        working-directory: cloudflare
        run: npx vitest run

      - name: wrangler deploy --dry-run
        working-directory: cloudflare
        run: npm run check
