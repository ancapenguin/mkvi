name: Publish signed update

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows-update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build signed updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build
      # The installer is committed into the PUBLIC mkvi-updates repo, not attached to a
      # release of this repo: ancapenguin/mkvi is private, so its release assets return
      # 404 to unauthenticated clients and the updater could never download them.
      # Moving these binaries out of git again requires a public download host first.
      - name: Publish public update feed
        shell: pwsh
        env:
          MKVI_UPDATES_DEPLOY_KEY_B64: ${{ secrets.MKVI_UPDATES_DEPLOY_KEY_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = Join-Path $env:RUNNER_TEMP 'mkvi-updates'
          [System.IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:MKVI_UPDATES_DEPLOY_KEY_B64))
          icacls $keyPath /inheritance:r /grant:r "$env:USERNAME`:(R)" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.ssh" | Out-Null
          ssh-keyscan github.com | Out-File -Append -Encoding ascii "$env:USERPROFILE\.ssh\known_hosts"
          $keyForSsh = $keyPath.Replace('\', '/')
          $env:GIT_SSH_COMMAND = "ssh -i `"$keyForSsh`" -o IdentitiesOnly=yes"
          git clone git@github.com:ancapenguin/mkvi-updates.git update-feed
          # tauri.conf.json is the single source of truth for the version. Reading it
          # from an env var left the file name as "MKVI__x64-setup.exe" and broke v0.1.3.
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          if (-not $version) { throw 'Could not read version from src-tauri/tauri.conf.json' }
          $installer = "MKVI_${version}_x64-setup.exe"
          $source = "src-tauri\target\release\bundle\nsis\$installer"
          if (-not (Test-Path $source)) { throw "Installer not found at $source" }
          if (-not (Test-Path "$source.sig")) { throw "Signature not found at $source.sig" }
          $signature = (Get-Content "$source.sig" -Raw).Trim()
          # The binary itself has to live in the public feed repo: release assets of a
          # private repo return 404 to the unauthenticated updater and to any guest link.
          New-Item -ItemType Directory -Force -Path update-feed\windows-x86_64 | Out-Null
          Copy-Item $source (Join-Path 'update-feed\windows-x86_64' $installer) -Force
          $downloadUrl = "https://raw.githubusercontent.com/ancapenguin/mkvi-updates/main/windows-x86_64/$installer"
          $metadata = @{ version = $version; notes = "MKVI $version"; pub_date = (Get-Date).ToUniversalTime().ToString('o'); platforms = @{ 'windows-x86_64' = @{ url = $downloadUrl; signature = $signature } } } | ConvertTo-Json -Depth 5
          Set-Content -Path update-feed\latest.json -Value $metadata -NoNewline -Encoding utf8NoBOM
          Set-Location update-feed
          git config user.name 'MKVI updater'
          git config user.email 'actions@github.com'
          git add windows-x86_64 latest.json
          if (-not (git status --porcelain)) { Write-Host 'Feed already up to date.'; exit 0 }
          git commit -m "Publish MKVI $version"
          git push
          Write-Host "Published: $downloadUrl"
